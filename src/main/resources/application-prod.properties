# 배포용 DB 접속 정보 — 값은 전부 환경변수로 받음 (코드에 비밀번호 안 남기려고)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Redis — 값은 EC2 ~/app/.env의 REDIS_HOST/REDIS_PORT로 주입
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}

# 운영에서는 SQL 로그를 끔 (로그가 너무 많이 쌓이는 것 방지)
logging.level.org.hibernate.SQL=warn

# TourAPI 온천 데이터는 배치로 DB에 동기화하고 지도는 DB를 조회한다.
external.tour-api.sync-enabled=${TOUR_API_SYNC_ENABLED:true}

# CORS 허용 출처 — GitHub Variables의 CORS_ORIGINS로 주입. 없으면 Vercel 주소만 허용
app.cors.allowed-origins=${CORS_ORIGINS:https://*.vercel.app}

# JWT — 비밀키는 EC2 ~/app/.env의 JWT_SECRET으로 주입. 쿠키는 운영에서 항상 Secure
jwt.secret=${JWT_SECRET}
jwt.refresh-cookie-secure=true

# S3/CloudFront — EC2 IAM role supplies AWS credentials; only resource settings come from env.
app.s3.region=${AWS_REGION:ap-northeast-2}
app.s3.bucket=${S3_BUCKET}
app.s3.cloudfront-base-url=${S3_PUBLIC_BASE_URL}
app.s3.presign-expiry-seconds=${AWS_S3_PRESIGN_EXPIRY_SECONDS:300}
