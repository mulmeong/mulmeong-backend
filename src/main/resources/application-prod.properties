# 배포용 DB 접속 정보 — 값은 전부 환경변수로 받음 (코드에 비밀번호 안 남기려고)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Redis — 값은 EC2 ~/app/.env의 REDIS_HOST/REDIS_PORT로 주입
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}

# 운영에서는 SQL 로그를 끔 (로그가 너무 많이 쌓이는 것 방지)
logging.level.org.hibernate.SQL=warn

# CORS 허용 출처 — GitHub Variables의 CORS_ORIGINS로 주입. 없으면 Vercel 주소만 허용
app.cors.allowed-origins=${CORS_ORIGINS:https://*.vercel.app}

# 관광공사 TourAPI 인증키 — GitHub Secrets의 TOUR_API_KEY로 주입
tour.api.key=${TOUR_API_KEY}

# JWT — 비밀키는 EC2 ~/app/.env의 JWT_SECRET으로 주입. 쿠키는 운영에서 항상 Secure
jwt.secret=${JWT_SECRET}
jwt.refresh-cookie-secure=true
