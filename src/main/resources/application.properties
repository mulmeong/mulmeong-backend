spring.application.name=mulmeong-backend
spring.profiles.active=local

# JPA / Hibernate
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway (schema is managed by src/main/resources/db/migration/*.sql)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.data.redis.repositories.enabled=false

# JWT token lifetimes are the same in every environment.
# jwt.secret / jwt.refresh-cookie-secure are set per profile (application-local / application-prod).
jwt.access-token-expire-seconds=1800
jwt.refresh-token-expire-seconds=1209600

# springdoc / Swagger UI  ->  http://localhost:8080/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# CORS 허용 출처 (콤마로 구분). 로컬 개발용 기본값
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,https://*.vercel.app
