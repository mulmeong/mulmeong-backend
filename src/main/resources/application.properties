spring.application.name=mulmeong-backend
spring.profiles.active=local

# JPA / Hibernate
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway (schema is managed by src/main/resources/db/migration/*.sql)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# SMTP credentials are supplied only through environment variables.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:true}
app.password-reset.frontend-url=${PASSWORD_RESET_FRONTEND_URL:http://localhost:5173}

spring.data.redis.repositories.enabled=false

# JWT token lifetimes are the same in every environment.
# jwt.secret / jwt.refresh-cookie-secure are set per profile (application-local / application-prod).
jwt.access-token-expire-seconds=1800
jwt.refresh-token-expire-seconds=1209600

# springdoc / Swagger UI  ->  http://localhost:8080/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# CORS 허용 출처 (콤마로 구분). 로컬 개발용 기본값
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,https://*.vercel.app

# External API credentials are supplied through the runtime environment.
external.kakao.rest-api-key=${KAKAO_REST_API_KEY:}
external.tour-api.service-key=${TOUR_API_SERVICE_KEY:}
external.tour-api.sync-enabled=${TOUR_API_SYNC_ENABLED:false}
external.tour-api.sync-cron=${TOUR_API_SYNC_CRON:0 30 3 * * *}

app.s3.region=${AWS_REGION:ap-northeast-2}
app.s3.bucket=${S3_BUCKET:}
app.s3.cloudfront-base-url=${S3_PUBLIC_BASE_URL:}
app.s3.presign-expiry-seconds=${AWS_S3_PRESIGN_EXPIRY_SECONDS:300}

# Dart recommendation tuning (kept configurable for demo feedback)
app.dart.road-factor=${DART_ROAD_FACTOR:1.3}
app.dart.car-kmh=${DART_CAR_KMH:70}
app.dart.transit-kmh=${DART_TRANSIT_KMH:60}
app.dart.transit-transfer-min=${DART_TRANSIT_TRANSFER_MIN:25}
app.dart.min-pool=${DART_MIN_POOL:8}
app.dart.weight-village=${DART_WEIGHT_VILLAGE:6}
app.dart.weight-walkable=${DART_WEIGHT_WALKABLE:3}
app.dart.weight-lodging=${DART_WEIGHT_LODGING:2}
app.dart.recent-penalty-divisor=${DART_RECENT_PENALTY_DIVISOR:4}
