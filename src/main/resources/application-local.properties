# Local development only. Postgres/Redis come from compose.yaml
# (spring-boot-docker-compose auto-starts them for bootRun — devtools-scoped, so it never
# ships in the packaged jar and never runs under the prod profile).
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/mulmeong
spring.datasource.username=mulmeong
spring.datasource.password=mulmeong

spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379

# Dev-only secret — do not reuse in any deployed environment.
jwt.secret=local-dev-jwt-secret-please-change-before-any-real-deploy-0123456789
jwt.refresh-cookie-secure=false

app.cors.allowed-origins=http://localhost:5173

# S3/CloudFront — local presign testing values are supplied through the environment.
app.s3.bucket=${S3_BUCKET:}
app.s3.cloudfront-base-url=${S3_PUBLIC_BASE_URL:}
app.s3.presign-expiry-seconds=${AWS_S3_PRESIGN_EXPIRY_SECONDS:300}

# SQL logging for local development
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.orm.jdbc.bind=trace
